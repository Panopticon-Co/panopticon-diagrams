<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-act-title pan-act-desc">
      <title id="pan-act-title">Panopticon event lifecycle activity</title>
      <desc id="pan-act-desc">Four partitions follow one event: the Officer agent collects, normalizes and posts it; the manager validates each line, commits the valid ones and acknowledges with 200 listing anything rejected; the detection worker later claims the batch, runs detection, persists any alert and marks the event done; the console polls the resulting file and renders the alert table.</desc>
      <defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-faint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.45)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

