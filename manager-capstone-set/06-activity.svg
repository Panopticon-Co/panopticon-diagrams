      <text x="688" y="347" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">valid?</text>
      <polygon points="728,468 776,504 728,540 680,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="507" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert?</text>

      <!-- ===== ACTIVITIES ===== -->
      <rect x="232" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect event</text>
      <text x="312" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ETW + Sysmon</text>

      <rect x="440" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Normalize</text>
      <text x="520" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to Schema 0.3</text>

      <rect x="648" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Batch + POST</text>
      <text x="728" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WinHTTP, HTTPS</text>

      <rect x="440" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate lines</text>
      <text x="520" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">per-event schema</text>

      <rect x="784" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="784" y="312" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="864" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit as pending</text>
      <text x="864" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT OR IGNORE</text>

      <rect x="1024" y="312" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1024" y="312" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1104" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ack 200</text>
      <text x="1104" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">accepted + rejected[]</text>

      <rect x="232" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="472" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claim batch</text>
      <text x="312" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lease 60s, max 256</text>

      <rect x="440" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="472" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="520" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run detection</text>
      <text x="520" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">86 rules, 11 engines</text>

      <rect x="856" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="472" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="936" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persist alert</text>
      <text x="936" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row + ndjson line</text>

      <rect x="1064" y="472" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1064" y="472" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1144" y="500" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mark done</text>
      <text x="1144" y="518" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">detect_state=done</text>

      <rect x="232" y="632" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="632" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="312" y="660" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Poll alerts</text>
      <text x="312" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api/alerts, 3s</text>

      <rect x="440" y="632" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="632" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="520" y="660" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Render table</text>
      <text x="520" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alert + evidence</text>

