      <text x="812" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
      <path d="M 728,468 V 460 Q 728,452 736,452 H 1032 Q 1040,452 1040,460 V 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="884" y="432" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="900" y="441" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <line x1="1016" y1="504" x2="1036" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1044" y1="504" x2="1064" y2="504" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="392" y1="664" x2="440" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="664" x2="650" y2="664" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

