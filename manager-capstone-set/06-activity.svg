      <rect x="548" y="408" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="588" y="417" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENTS PENDING</text>

      <path d="M 936,536 V 568 Q 936,576 928,576 H 320 Q 312,576 312,584 V 632" fill="none" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-faint)"/>
      <rect x="480" y="556" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="565" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS.NDJSON</text>

