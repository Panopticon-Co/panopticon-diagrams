      <line x1="392" y1="184" x2="440" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="184" x2="648" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

