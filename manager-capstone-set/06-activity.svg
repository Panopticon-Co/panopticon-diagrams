      <line class="decor" x1="32" y1="744" x2="1248" y2="744" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <line class="decor" x1="168" y1="104" x2="168" y2="744" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <text x="100" y="187" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OFFICER AGENT</text>
      <text x="100" y="347" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MANAGER API</text>
      <text x="100" y="507" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DETECTION WORKER</text>
      <text x="100" y="667" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONSOLE</text>

