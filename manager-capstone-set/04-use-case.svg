<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-uc-title pan-uc-desc">
      <title id="pan-uc-title">Panopticon EDR use case model</title>
      <desc id="pan-uc-desc">Endpoint agents drive telemetry streaming and execute authorized commands with start_time_ticks verification; the Detection Scheduler drives detection, alert persistence, and response recommendation staging; SOC analysts review alerts, authorize response actions, and inspect incident timelines.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#eb6c36" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== SYSTEM BOUNDARY ===== -->
      <rect x="256" y="96" width="688" height="640" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="272" y="100" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="109" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PANOPTICON PLATFORM BOUNDARY</text>

      <!-- ===== RELATIONSHIPS ===== -->
      <!-- Agent to Stream Telemetry -->
      <path d="M 176,200 H 220 Q 228,200 228,168 V 168 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- Agent to Ingest Telemetry Batch -->
      <path d="M 176,216 H 240 Q 248,216 248,256 H 280" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- Ingest Batch ..> Validate Schema (include) -->
      <line x1="520" y1="256" x2="660" y2="256" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="568" y="236" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>

      <!-- Detection Scheduler to Run Detection -->
      <line x1="176" y1="368" x2="280" y2="368" stroke="#4f5d75" stroke-width="1"/>
      <!-- Run Detection ..> Raise and Persist Alert (include) -->
      <line x1="400" y1="404" x2="400" y2="444" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="408" y="416" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="436" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>

      <!-- Run Detection ..> Stage Response Recommendation (include) -->
      <path d="M 520,368 H 600 Q 608,368 608,356 V 356 H 660" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="568" y="348" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="357" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>

      <!-- Analyst to Review Alerts in Console -->
      <path d="M 1024,472 H 980 Q 972,472 972,464 V 464 H 900" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- Analyst to Authorize Response Action (FOCAL) -->
      <path d="M 1024,490 H 948 Q 940,490 940,576 H 900" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
      <!-- Authorize Action ..> Reject Action (extend) -->
      <line x1="660" y1="576" x2="520" y2="576" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="572" y="556" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="565" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;extend&#187;</text>

      <!-- Agent to Execute Endpoint Action -->
      <path d="M 176,232 H 212 Q 220,232 220,668 H 280" fill="none" stroke="#eb6c36" stroke-width="1.2"/>
      <!-- Execute Endpoint Action ..> Submit Evidence (include) -->
      <line x1="520" y1="668" x2="660" y2="668" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="568" y="648" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="657" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>

      <!-- ===== USE CASES ===== -->
      <!-- UC1: Stream Endpoint Telemetry -->
      <ellipse cx="400" cy="168" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stream Endpoint Telemetry</text>
      <text x="400" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ETW / Sysmon &amp; procfs (0.3 / 0.4)</text>

      <!-- UC2: Ingest Telemetry Batch -->
      <ellipse cx="400" cy="256" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest Telemetry Batch</text>
      <text x="400" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/v1/ingest &#183; SQLite commit</text>

      <!-- UC3: Validate Event Schema -->
      <ellipse cx="780" cy="256" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="780" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate Schema &amp; Dedup</text>
      <text x="780" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200 Ack: accepted, rejected[]</text>

      <!-- UC4: Run Detection & Correlation (FOCAL) -->
      <ellipse cx="400" cy="368" rx="120" ry="36" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="400" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Detection &amp; Correlation</text>
      <text x="400" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">74 rules &#183; 17 domains &#183; Provenance</text>

      <!-- UC5: Stage Response Recommendation -->
      <ellipse cx="780" cy="356" rx="120" ry="32" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="780" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stage Response Action</text>
      <text x="780" y="368" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">classify tier &#183; stage PENDING</text>

      <!-- UC6: Raise and Persist Alert -->
      <ellipse cx="400" cy="480" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Raise &amp; Persist Alert</text>
      <text x="400" y="492" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">alerts table + alerts.ndjson</text>

      <!-- UC7: Review Alerts in Console -->
      <ellipse cx="780" cy="464" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="780" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review Alerts &amp; Incidents</text>
      <text x="780" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">poll every 3s &#183; timeline graph</text>

      <!-- UC8: Authorize Response Action (FOCAL) -->
      <ellipse cx="780" cy="576" rx="120" ry="36" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="780" y="572" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Authorize Response Action</text>
      <text x="780" y="588" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">transitions PENDING &rarr; AUTHORIZED</text>

      <!-- UC9: Reject Response Action -->
      <ellipse cx="400" cy="576" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="572" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reject Response Action</text>
      <text x="400" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">analyst decline &#183; mark REJECTED</text>

      <!-- UC10: Execute Endpoint Action -->
      <ellipse cx="400" cy="668" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="664" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Execute Endpoint Action</text>
      <text x="400" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">verify start_time / boot_id &#183; isolate</text>

      <!-- UC11: Submit Cryptographic Evidence -->
      <ellipse cx="780" cy="668" rx="120" ry="32" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="780" y="664" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Submit Execution Evidence</text>
      <text x="780" y="680" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">signatures, status, output hashes</text>

      <!-- ===== ACTORS ===== -->
      <!-- A1: Managed Endpoints -->
      <circle cx="140" cy="180" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="192" x2="140" y2="228" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="120" y1="204" x2="160" y2="204" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="228" x2="124" y2="256" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="228" x2="156" y2="256" stroke="#2d3142" stroke-width="1.2"/>
      <text x="140" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Managed Endpoints</text>
      <text x="140" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Windows &amp; Linux Agents</text>

      <!-- A2: Detection Scheduler -->
      <circle cx="140" cy="344" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="356" x2="140" y2="392" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="120" y1="368" x2="160" y2="368" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="392" x2="124" y2="420" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="140" y1="392" x2="156" y2="420" stroke="#2d3142" stroke-width="1.2"/>
      <text x="140" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detection Scheduler</text>
      <text x="140" y="456" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&#171;time&#187; claim loop</text>

      <!-- A3: SOC Security Analyst -->
      <circle cx="1060" cy="460" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="1060" y1="472" x2="1060" y2="508" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="1040" y1="484" x2="1080" y2="484" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="1060" y1="508" x2="1044" y2="536" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="1060" y1="508" x2="1076" y2="536" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1060" y="556" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SOC Security Analyst</text>
      <text x="1060" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser @ :8787</text>

      <!-- ===== LEGEND ===== -->
      <line x1="32" y1="784" x2="1168" y2="784" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="804" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="38" cy="830" r="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line x1="38" y1="835" x2="38" y2="842" stroke="#2d3142" stroke-width="1"/>
      <line x1="32" y1="838" x2="44" y2="838" stroke="#2d3142" stroke-width="1"/>
      <text x="54" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTOR</text>

      <ellipse cx="180" cy="834" rx="12" ry="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">USE CASE</text>

      <ellipse cx="320" cy="834" rx="12" ry="7" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="340" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL USE CASE</text>

      <line x1="520" y1="834" x2="544" y2="834" stroke="#4f5d75" stroke-width="1"/>
      <text x="556" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASSOCIATION</text>

      <line x1="720" y1="834" x2="744" y2="834" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="756" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INCLUDE / EXTEND</text>

      <line x1="940" y1="834" x2="964" y2="834" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="976" y="837" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CLOSED-LOOP RESPONSE</text>
    </svg>
