<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon Ingest and Detection Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em;
               text-transform:uppercase; color: var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400;
         letter-spacing:-0.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence &#183; Panopticon&amp;Co</p>
    <h1>One batch, from POST to alert &mdash; ingest and detection</h1>

    <svg viewBox="0 0 1120 872" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-seq-title pan-seq-desc">
      <title id="pan-seq-title">Panopticon ingest and detection sequence</title>
      <desc id="pan-seq-desc">The Officer uploader posts an NDJSON batch to the ingest API, which commits the events to SQLite and acknowledges with 200 before any detection happens; separately and later, the detection worker claims pending rows and loops over each one, driving DetectionRun, persisting emitted alerts and marking the event done.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== LIFELINES ===== -->
      <line class="lifeline" x1="128" y1="160" x2="128" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line class="lifeline" x1="344" y1="160" x2="344" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line class="lifeline" x1="560" y1="160" x2="560" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line class="lifeline" x1="776" y1="160" x2="776" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line class="lifeline" x1="992" y1="160" x2="992" y2="760" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== LOOP FRAGMENT ===== -->
      <rect class="frame" x="536" y="528" width="488" height="192" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect class="frame" x="536" y="528" width="48" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="560" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="572" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[for each claimed event]</text>

      <!-- ===== ACTIVATION BARS ===== -->
      <rect class="decor" x="124" y="208" width="8" height="160" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="340" y="208" width="8" height="160" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="556" y="264" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="556" y="448" width="8" height="56" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="556" y="608" width="8" height="108" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="772" y="448" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect class="decor" x="988" y="576" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ===== PHASE DIVIDER ===== -->
      <line class="decor" x1="40" y1="408" x2="1080" y2="408" stroke="rgba(45,49,66,0.16)" stroke-width="0.8" stroke-dasharray="2,4"/>
      <rect x="160" y="388" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="397" fill="rgba(45,49,66,0.45)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ASYNCHRONOUS &#183; LATER</text>

      <!-- ===== MESSAGES ===== -->
      <!-- m1 -->
      <line x1="132" y1="216" x2="340" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="180" y="196" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="205" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /api/v1/ingest</text>
      <!-- m2 -->
      <line x1="348" y1="272" x2="556" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="404" y="252" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT OR IGNORE</text>
      <!-- m3 -->
      <line x1="556" y1="312" x2="348" y2="312" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="428" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="452" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROWCOUNT</text>
      <!-- m4  headline ack -->
      <line x1="340" y1="360" x2="132" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="200" y="340" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="236" y="349" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 ACCEPTED</text>
      <!-- m5 -->
      <line x1="772" y1="456" x2="564" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="624" y="436" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="445" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM_BATCH()</text>
      <!-- m6 -->
      <line x1="564" y1="496" x2="772" y2="496" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="632" y="476" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING ROWS</text>
      <!-- m7 -->
      <line x1="780" y1="584" x2="988" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="832" y="564" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="573" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROCESS_EVENT()</text>
      <!-- m8 -->
      <line x1="988" y1="624" x2="564" y2="624" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="612" y="604" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="664" y="613" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMIT: INSERT ALERT</text>
      <!-- m9 -->
      <line x1="988" y1="664" x2="780" y2="664" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="856" y="644" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="880" y="653" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS[]</text>
      <!-- m10 -->
      <line x1="772" y1="704" x2="564" y2="704" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="640" y="684" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="693" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MARK DONE</text>

      <!-- ===== CALLOUT ===== -->
      <text x="56" y="520" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The 200 is already sent &#8212; detection</text>
      <text x="56" y="540" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">is a separate transaction and thread.</text>
      <path d="M 140 504 Q 150 458 172 414" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="172" cy="410" r="2" fill="#2d3142"/>

      <!-- ===== ACTOR BOXES ===== -->
      <rect x="40" y="96" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="128" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Officer Uploader</text>
      <text x="128" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">panopticon-agent</text>

      <rect x="256" y="96" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="344" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest API</text>
      <text x="344" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v1/ingest</text>

      <rect x="472" y="96" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="560" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">panopticon.db</text>
      <text x="560" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite &#183; WAL</text>

      <rect x="688" y="96" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="776" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detection Worker</text>
      <text x="776" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one thread</text>

      <rect x="904" y="96" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="992" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DetectionRun</text>
      <text x="992" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vendor/eyedetect</text>

      <!-- ===== LEGEND ===== -->
      <line class="legend" x1="40" y1="792" x2="1080" y2="792" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="812" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line class="legend" x1="40" y1="836" x2="64" y2="836" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="74" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL (SYNC)</text>

      <line class="legend" x1="216" y1="836" x2="240" y2="836" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="250" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

      <line class="legend" x1="392" y1="836" x2="416" y2="836" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="426" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS CALL</text>

      <line class="legend" x1="568" y1="836" x2="592" y2="836" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="602" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HEADLINE ACK</text>

      <rect class="legend" x="748" y="828" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="770" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTIVATION</text>

      <rect class="legend" x="920" y="828" width="24" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="954" y="839" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LOOP FRAGMENT</text>
    </svg>
  </div>
</body>
</html>
