<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-arch-title pan-arch-desc">
      <title id="pan-arch-title">Panopticon EDR system architecture and closed-loop response</title>
      <desc id="pan-arch-desc">Telemetry flows from Windows ETW/Sysmon and Linux procfs/eBPF agents over HTTPS to Manager ingest API, committed to SQLite WAL. Detection worker claims batches, runs eyedetect and response engine to stage response actions. Analysts authorize actions in Console, which dispatches typed commands to endpoint executors.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES ============ -->
      <!-- Zone 1: Endpoints -->
      <rect x="32" y="104" width="312" height="528" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="48" y="108" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="116" y="117" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MANAGED ENDPOINTS</text>

      <!-- Zone 2: Manager -->
      <rect x="376" y="104" width="528" height="528" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="392" y="108" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="456" y="117" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MANAGER CONTROL PLANE</text>

      <!-- Zone 3: Presentation -->
      <rect x="936" y="104" width="232" height="528" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="952" y="108" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1012" y="117" fill="rgba(45,49,66,0.50)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PRESENTATION / SOC</text>

      <!-- ============ CONNECTORS ============ -->
      <!-- Windows Agent -> Ingest API -->
      <path d="M 288,180 H 340 Q 348,180 348,172 V 172 H 408" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="296" y="160" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="169" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS (0.3)</text>

      <!-- Linux Agent -> Ingest API -->
      <path d="M 288,300 H 348 Q 356,300 356,216 Q 356,204 368,204 H 408" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="296" y="272" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="281" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS (0.4)</text>

      <!-- Ingest API -> SQLite (Commit) -->
      <line x1="512" y1="216" x2="512" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="520" y="240" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT EVENTS</text>

      <!-- SQLite -> Detection Worker (Claim) -->
      <line x1="512" y1="368" x2="512" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="520" y="396" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="562" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM BATCH &le;256</text>

      <!-- Detection Worker -> Detection Core (Process) -->
      <line x1="608" y1="480" x2="688" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="460" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="469" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROCESS EVENT</text>

      <!-- Detection Core -> SQLite (Alerts & Incidents) -->
      <path d="M 728,440 V 380 Q 728,372 720,372 H 616" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="632" y="360" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="674" y="369" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT ALERT</text>

      <!-- Detection Core -> Response Policy -> SQLite (Stage Response Actions) -->
      <path d="M 784,528 V 564 Q 784,572 776,572 H 584 Q 576,572 576,564 V 368" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="620" y="580" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="589" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STAGE RESPONSE (PENDING)</text>

      <!-- Console Server -> SQLite (Query Alerts & Actions) -->
      <path d="M 960,200 H 688 Q 680,200 680,272 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="748" y="188" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="197" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY ALERTS / ACTIONS</text>

      <!-- Console Server -> Analyst Browser -->
      <line x1="1048" y1="240" x2="1048" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1056" y="320" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1096" y="329" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP POLL 3s</text>

      <!-- Analyst -> Console -> Manager Authorize Action -->
      <path d="M 960,490 H 872 Q 864,490 864,228 Q 864,216 852,216 H 616" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="888" y="376" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="944" y="385" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUTHORIZE ACTION</text>

      <!-- Manager Commands API -> Endpoint Command Outbox / Polling -->
      <path d="M 408,190 H 372 Q 360,190 360,490 H 288" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="296" y="472" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="348" y="481" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH COMMAND</text>

      <!-- ============ NODES ============ -->
      <!-- Node 1: Windows Officer Agent -->
      <rect x="56" y="144" width="232" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="144" width="232" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="152" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="84" y="161" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="172" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Windows Officer Agent</text>
      <text x="172" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ETW + Sysmon &#183; Schema 0.3</text>
      <text x="172" y="206" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite Spool &#183; WinHTTP batch</text>

      <!-- Node 2: Linux Agent -->
      <rect x="56" y="264" width="232" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="264" width="232" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="272" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="84" y="281" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="172" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linux Officer Agent</text>
      <text x="172" y="310" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">procfs / eBPF &#183; Schema 0.4</text>
      <text x="172" y="326" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">libbpf CO-RE &#183; HTTPS upload</text>

      <!-- Node 3: Endpoint Response Executors -->
      <rect x="56" y="440" width="232" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="440" width="232" height="88" rx="6" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="64" y="448" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="90" y="457" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXECUTOR</text>
      <text x="172" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Safe Command Executors</text>
      <text x="172" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PID start_time / boot_id verified</text>
      <text x="172" y="504" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CAP_NET_ADMIN UDS Helper / WFP</text>

      <!-- Node 4: Manager API (FOCAL) -->
      <rect x="408" y="144" width="208" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="144" width="208" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="416" y="152" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="430" y="161" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="512" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager Control API</text>
      <text x="512" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v1/ingest &#183; /commands</text>
      <text x="512" y="204" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/api/v1/response-actions</text>

      <!-- Node 5: SQLite Database (Store) -->
      <rect x="408" y="280" width="208" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="280" width="208" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="416" y="288" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="428" y="297" fill="rgba(79,93,117,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="512" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">panopticon.db (WAL)</text>
      <text x="512" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">events &#183; alerts &#183; incidents</text>
      <text x="512" y="344" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">response_actions &#183; commands</text>

      <!-- Node 6: Detection Worker -->
      <rect x="408" y="440" width="200" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="440" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="448" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="438" y="457" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THREAD</text>
      <text x="508" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detection Worker</text>
      <text x="508" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claim &#183; lease 60s</text>
      <text x="508" y="504" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BEGIN IMMEDIATE batch</text>

      <!-- Node 7: Detection Core (FOCAL) -->
      <rect x="688" y="440" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="440" width="192" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="696" y="448" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="718" y="457" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
      <text x="784" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detection Core</text>
      <text x="784" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">74 rules &#183; 17 domains</text>
      <text x="784" y="504" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Provenance &amp; Risk Scorer</text>

      <!-- Node 8: Response Engine Policy -->
      <rect x="688" y="280" width="192" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="280" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="288" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="718" y="297" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY</text>
      <text x="784" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Response Engine</text>
      <text x="784" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">7 closed actions &#183; 2 tiers</text>
      <text x="784" y="344" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AUTO_SAFE / APPROVAL</text>

      <!-- Node 9: Console Server -->
      <rect x="960" y="160" width="184" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="160" width="184" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="968" y="168" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="986" y="177" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SERVER</text>
      <text x="1052" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Console Server</text>
      <text x="1052" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">127.0.0.1:8787</text>
      <text x="1052" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Decision Proxy &amp; Static UI</text>

      <!-- Node 10: SOC Analyst Interface -->
      <rect x="960" y="440" width="184" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="440" width="184" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="968" y="448" width="24" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="980" y="457" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SOC</text>
      <text x="1052" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Security Analyst</text>
      <text x="1052" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Alert Review &amp; Triage</text>
      <text x="1052" y="504" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Authorize / Reject Actions</text>

      <!-- ============ CALLOUTS ============ -->
      <text x="900" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Ack at 200 before detection runs; destructive actions require analyst approval</text>
      <path d="M 680 80 Q 640 104 600 144" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="600" cy="144" r="2" fill="#2d3142"/>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="672" x2="1168" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="712" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="52" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL COMPONENT</text>

      <rect x="220" y="712" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SERVICE / THREAD</text>

      <rect x="408" y="712" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="428" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATA STORE (WAL)</text>

      <rect x="604" y="712" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="624" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SOC USER / ACTOR</text>

      <line x1="800" y1="718" x2="824" y2="718" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="836" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS TELEMETRY</text>

      <line x1="992" y1="718" x2="1016" y2="718" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="1028" y="721" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESPONSE ACTION LOOP</text>
    </svg>
