<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon Use Cases</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em;
               text-transform:uppercase; color: var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400;
         letter-spacing:-0.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML use case &#183; Panopticon&amp;Co</p>
    <h1>Who asks the platform for what &mdash; use cases</h1>

    <svg viewBox="0 0 1120 832" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-uc-title pan-uc-desc">
      <title id="pan-uc-title">Panopticon EDR use cases</title>
      <desc id="pan-uc-desc">The Officer agent on a Windows endpoint drives telemetry collection and batch ingest, which includes schema validation; a time-triggered detection scheduler drives detection and correlation, which includes raising and persisting an alert and is extended by a remediation step that only ever records simulated actions; the SOC analyst reviews the resulting alerts in the console.</desc>
      <defs>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== SYSTEM BOUNDARY ===== -->
      <rect x="288" y="104" width="624" height="592" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="304" y="108" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="117" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PANOPTICON EDR PLATFORM</text>

      <!-- ===== RELATIONSHIPS (before shapes) ===== -->
      <!-- r1  Officer Agent to Collect Endpoint Telemetry -->
      <path d="M 180,232 H 240 Q 248,232 248,224 V 184 Q 248,176 256,176 H 320" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- r2  Officer Agent to Ingest Telemetry Batch -->
      <path d="M 180,248 H 224 Q 232,248 232,256 V 280 Q 232,288 240,288 H 320" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <!-- r3  Ingest Telemetry Batch ..> Validate Event Schema  (include) -->
      <line x1="560" y1="288" x2="640" y2="288" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="572" y="268" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>
      <!-- r4  Detection Scheduler to Run Detection and Correlation -->
      <line x1="180" y1="400" x2="320" y2="400" stroke="#4f5d75" stroke-width="1"/>
      <!-- r5  Run Detection ..> Raise and Persist Alert  (include) -->
      <line x1="440" y1="436" x2="440" y2="476" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="448" y="448" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="476" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;include&#187;</text>
      <!-- r6  Simulate Remediation ..> Raise and Persist Alert  (extend) -->
      <line x1="640" y1="512" x2="560" y2="512" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <rect x="576" y="492" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="501" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&#171;extend&#187;</text>
      <!-- r7  SOC Analyst to Review Alerts in Console -->
      <line x1="880" y1="624" x2="988" y2="624" stroke="#4f5d75" stroke-width="1"/>

      <!-- ===== USE CASES ===== -->
      <ellipse cx="440" cy="176" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect Endpoint Telemetry</text>
      <text x="440" y="190" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ETW + Sysmon, schema 0.3</text>

      <ellipse cx="440" cy="288" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest Telemetry Batch</text>
      <text x="440" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">POST /api/v1/ingest</text>

      <ellipse cx="760" cy="288" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validate Event Schema</text>
      <text x="760" y="302" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">per line, rejected[] in ack</text>

      <ellipse cx="440" cy="400" rx="120" ry="36" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="440" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Detection &amp; Correlation</text>
      <text x="440" y="414" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">86 rules &#183; 11 engines</text>

      <ellipse cx="440" cy="512" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="440" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Raise &amp; Persist Alert</text>
      <text x="440" y="526" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">alerts table + ndjson</text>

      <ellipse cx="760" cy="512" rx="120" ry="36" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="760" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Simulate Remediation</text>
      <text x="760" y="526" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">dry_run &#183; records actions only</text>

      <ellipse cx="760" cy="624" rx="120" ry="36" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="760" y="620" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review Alerts in Console</text>
      <text x="760" y="638" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">poll every 3s</text>

      <!-- ===== ACTORS ===== -->
      <!-- A1  Windows Endpoint (Officer Agent) -->
      <circle cx="152" cy="208" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="220" x2="152" y2="256" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="132" y1="232" x2="172" y2="232" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="256" x2="136" y2="284" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="256" x2="168" y2="284" stroke="#2d3142" stroke-width="1.2"/>
      <text x="152" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Windows Endpoint</text>
      <text x="152" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">officer-agent.exe</text>

      <!-- A2  Detection Scheduler (time actor) -->
      <circle cx="152" cy="376" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="388" x2="152" y2="424" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="132" y1="400" x2="172" y2="400" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="424" x2="136" y2="452" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="152" y1="424" x2="168" y2="452" stroke="#2d3142" stroke-width="1.2"/>
      <text x="152" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detection Scheduler</text>
      <text x="152" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&#171;time&#187; claim loop</text>

      <!-- A3  SOC Analyst -->
      <circle cx="1016" cy="600" r="12" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="1016" y1="612" x2="1016" y2="648" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="996" y1="624" x2="1036" y2="624" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="1016" y1="648" x2="1000" y2="676" stroke="#2d3142" stroke-width="1.2"/>
      <line class="decor" x1="1016" y1="648" x2="1032" y2="676" stroke="#2d3142" stroke-width="1.2"/>
      <text x="1016" y="696" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SOC Analyst</text>
      <text x="1016" y="712" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser @ :8787</text>

      <!-- ===== LEGEND ===== -->
      <line class="legend" x1="64" y1="752" x2="1056" y2="752" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="772" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle class="legend" cx="70" cy="790" r="5" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <line class="legend" x1="70" y1="795" x2="70" y2="802" stroke="#2d3142" stroke-width="1"/>
      <line class="legend" x1="64" y1="798" x2="76" y2="798" stroke="#2d3142" stroke-width="1"/>
      <text x="88" y="797" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTOR</text>

      <ellipse class="legend" cx="246" cy="794" rx="12" ry="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="268" y="797" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">USE CASE</text>

      <ellipse class="legend" cx="422" cy="794" rx="12" ry="7" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="444" y="797" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL USE CASE</text>

      <ellipse class="legend" cx="646" cy="794" rx="12" ry="7" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="668" y="797" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SIMULATED ONLY</text>

      <line class="legend" x1="880" y1="794" x2="904" y2="794" stroke="#4f5d75" stroke-width="1"/>
      <text x="916" y="797" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ASSOCIATION</text>

      <line class="legend" x1="880" y1="812" x2="904" y2="812" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="916" y="815" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INCLUDE / EXTEND</text>
    </svg>
  </div>
</body>
</html>
