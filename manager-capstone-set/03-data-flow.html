<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon Data Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f5f5f5; --color-ink:#2d3142; --color-muted:#4f5d75; --color-accent:#eb6c36;
      --font-sans:'Geist', system-ui, sans-serif; --font-serif:'Instrument Serif', serif; --font-mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em;
               text-transform:uppercase; color: var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight:400;
         letter-spacing:-0.02em; line-height:1.15; color: var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow &#183; Level 1 &#183; Panopticon&amp;Co</p>
    <h1>Where telemetry becomes an alert &mdash; level-1 data flow</h1>

    <svg viewBox="0 0 1120 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pan-dfd-title pan-dfd-desc">
      <title id="pan-dfd-title">Panopticon level-1 data flow</title>
      <desc id="pan-dfd-desc">Raw records leave the Windows endpoint for process 1.0, which normalizes and posts them over HTTPS to process 2.0, which commits them to the events store; process 3.0 claims that store, writes alert rows and alert lines, and process 4.0 serves the NDJSON file to the SOC analyst. The alerts table has no reader until the planned Phase 7 query API.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-faint" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(45,49,66,0.40)"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== FLOWS (before nodes) ===== -->
      <!-- f1  E1 -> 1.0 -->
      <line x1="304" y1="164" x2="440" y2="164" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="340" y="144" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="153" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW RECORDS</text>
      <!-- f2  1.0 -> 2.0 -->
      <line x1="680" y1="164" x2="816" y2="164" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="712" y="144" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="153" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS NDJSON</text>
      <!-- f3  2.0 -> D1 -->
      <line x1="936" y1="208" x2="936" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="944" y="236" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="964" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMIT</text>
      <!-- f4  D1 -> 3.0 -->
      <line x1="816" y1="316" x2="680" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="716" y="296" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM BATCH</text>
      <!-- f5  3.0 -> D1 -->
      <line x1="680" y1="340" x2="816" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="720" y="352" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MARK DONE</text>
      <!-- f6  3.0 -> D2 -->
      <line x1="440" y1="316" x2="304" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="344" y="296" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="372" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERT ROW</text>
      <!-- f7  3.0 -> D3 -->
      <line x1="560" y1="368" x2="560" y2="448" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="568" y="396" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERT LINE</text>
      <!-- f8  D3 -> 4.0 -->
      <line x1="560" y1="520" x2="560" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="568" y="548" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ ALL</text>
      <!-- f9  4.0 -> E2 -->
      <line x1="680" y1="632" x2="816" y2="632" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="716" y="612" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="621" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERT JSON</text>
      <!-- f10 E2 -> 4.0 -->
      <line x1="816" y1="656" x2="680" y2="656" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="704" y="668" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="748" y="677" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/alerts</text>
      <!-- f11 D2 -> 4.0  (planned, Phase 7 query API) -->
      <path d="M 184,352 V 636 Q 184,644 192,644 H 440" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-faint)"/>
      <rect x="192" y="480" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="216" y="489" fill="rgba(45,49,66,0.55)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHASE 7</text>

      <!-- ===== EXTERNAL ENTITIES ===== -->
      <rect x="64" y="120" width="240" height="88" rx="4" fill="#f5f5f5"/>
      <rect x="64" y="120" width="240" height="88" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="128" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="94" y="137" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
      <text x="184" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Windows Endpoint</text>
      <text x="184" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ETW + Sysmon providers</text>

      <rect x="816" y="600" width="240" height="88" rx="4" fill="#f5f5f5"/>
      <rect x="816" y="600" width="240" height="88" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="824" y="608" width="44" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="846" y="617" fill="rgba(122,131,153,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
      <text x="936" y="648" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SOC Analyst</text>
      <text x="936" y="666" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">browser @ :8787</text>

      <!-- ===== PROCESSES ===== -->
      <rect x="440" y="120" width="240" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="120" width="240" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="464" y="137" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1.0</text>
      <text x="560" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Collect &amp; Normalize</text>
      <text x="560" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">panopticon-agent</text>

      <rect x="816" y="120" width="240" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="816" y="120" width="240" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="824" y="128" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="840" y="137" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2.0</text>
      <text x="936" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest &amp; Validate</text>
      <text x="936" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routers/ingest.py</text>

      <rect x="440" y="280" width="240" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="280" width="240" height="88" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="288" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="464" y="297" fill="rgba(235,108,54,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3.0</text>
      <text x="560" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Detect &amp; Correlate</text>
      <text x="560" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">worker + DetectionRun</text>

      <rect x="440" y="600" width="240" height="88" rx="8" fill="#f5f5f5"/>
      <rect x="440" y="600" width="240" height="88" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="608" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="464" y="617" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4.0</text>
      <text x="560" y="648" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Serve Console</text>
      <text x="560" y="666" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console/app.py</text>

      <!-- ===== DATA STORES (open-ended) ===== -->
      <rect class="node" x="816" y="280" width="240" height="72" fill="rgba(45,49,66,0.05)"/>
      <line class="decor" x1="816" y1="280" x2="1056" y2="280" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="816" y1="352" x2="1056" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="816" y1="280" x2="816" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="856" y1="280" x2="856" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <text x="836" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">D1</text>
      <text x="956" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">events</text>
      <text x="956" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite &#183; detect_state</text>

      <rect class="node" x="64" y="280" width="240" height="72" fill="rgba(45,49,66,0.05)"/>
      <line class="decor" x1="64" y1="280" x2="304" y2="280" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="64" y1="352" x2="304" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="64" y1="280" x2="64" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="104" y1="280" x2="104" y2="352" stroke="#4f5d75" stroke-width="1"/>
      <text x="84" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">D2</text>
      <text x="204" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">alerts</text>
      <text x="204" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite &#183; no reader yet</text>

      <rect class="node" x="440" y="448" width="240" height="72" fill="rgba(45,49,66,0.05)"/>
      <line class="decor" x1="440" y1="448" x2="680" y2="448" stroke="#4f5d75" stroke-width="1"/>
      <line class="decor" x1="440" y1="520" x2="680" y2="520" stroke="#4f5d75" stroke-width="1"/>

      <line class="decor" x1="480" y1="448" x2="480" y2="520" stroke="#4f5d75" stroke-width="1"/>
      <text x="460" y="488" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">D3</text>
      <text x="580" y="482" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">alerts.ndjson</text>
      <text x="580" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">append-only file</text>

      <!-- ===== LEGEND ===== -->
      <line class="legend" x1="64" y1="736" x2="1056" y2="736" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="756" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect class="legend" x="64" y="776" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>

      <rect class="legend" x="568" y="776" width="12" height="12" fill="rgba(45,49,66,0.05)"/>
      <line class="legend" x1="568" y1="776" x2="580" y2="776" stroke="#4f5d75" stroke-width="1"/>
      <line class="legend" x1="568" y1="788" x2="580" y2="788" stroke="#4f5d75" stroke-width="1"/>

      <text x="588" y="785" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATA STORE</text>

      <text x="940" y="785" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PLANNED FLOW</text>
    </svg>
  </div>
</body>
</html>
