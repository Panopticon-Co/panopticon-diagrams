<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Panopticon — Attack Detection and Investigation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1500px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scenario view &middot; Not a system architecture</p>
    <h1>One obfuscated PowerShell launch, followed end to end</h1>

    <svg viewBox="0 0 1540 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="invest-title invest-desc">

      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <rect x="48" y="592" width="1440" height="120" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="248" y1="112" x2="248" y2="712" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <text x="64" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Windows endpoint</text>
      <text x="64" y="182" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">elevated session</text>
      <text x="64" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Officer agent</text>
      <text x="64" y="302" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">officer-agent.exe</text>
      <text x="64" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">eyedetect engine</text>

      <text x="64" y="644" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Security Analyst</text>
      <text x="64" y="662" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">read-only</text>

      <!-- ================= FLOW ARROWS ================= -->
      <path d="M 496,172 H 620 Q 628,172 628,180 V 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 744,292 H 868 Q 876,292 876,300 V 372" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="992" y1="412" x2="1020" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 1240,412 H 1364 Q 1372,412 1372,420 V 492" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1380" y1="568" x2="1380" y2="612" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= ARROW LABELS ================= -->
      <rect x="512" y="146" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="155" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ETW + SYSMON EID 1</text>

      <rect x="760" y="266" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="275" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NDJSON, SCHEMA 0.3</text>

      <rect x="1256" y="386" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1260" y="395" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALERTS.NDJSON</text>

      <rect x="1390" y="584" width="96" height="12" rx="2" fill="#f5f5f5"/>

      <!-- ================= STEPS ================= -->
      <rect x="280" y="136" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="136" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="156" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">1</text>
      <text x="292" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Encoded PowerShell</text>
      <text x="292" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">-NoProfile -EncodedCommand</text>

      <rect x="528" y="256" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="528" y="256" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="540" y="276" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">2</text>
      <text x="540" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Observe and normalize</text>
      <text x="540" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">derive proc_ id, emit one line</text>

      <rect x="776" y="376" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="376" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="788" y="396" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">3</text>
      <text x="788" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Ingest and evaluate</text>
      <text x="788" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">event_type = process_create</text>

      <rect x="1024" y="376" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1024" y="376" width="216" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1036" y="396" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">4 · DETECTION</text>
      <text x="1036" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">DET-PROC-011 fires</text>
      <text x="1036" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">alert persisted, then appended</text>

      <rect x="1272" y="496" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1272" y="496" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1284" y="516" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">5</text>
      <text x="1284" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Row appears</text>
      <text x="1284" y="554" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">within one 3 s poll</text>

      <rect x="1272" y="616" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="1272" y="616" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1284" y="636" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">6</text>
      <text x="1284" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Read the evidence</text>
      <text x="1284" y="674" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">then act outside the tool</text>

      <!-- ================= RULE DETAIL PANEL ================= -->
      <rect x="48" y="744" width="1440" height="140" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="72" y="770" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHAT ACTUALLY MATCHED, AND WHAT THE ALERT CARRIES</text>
      <text x="72" y="796" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">DET-PROC-011 &#8212; High-Entropy Obfuscated Script Execution</text>
      <text x="72" y="818" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">process.name in {powershell.exe, cmd.exe, mshta.exe, wscript.exe, cscript.exe, pwsh.exe}</text>
      <text x="72" y="836" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">AND Shannon entropy of process.command_line &gt; 4.3 &#8212; the demonstration command scores about 4.66</text>
      <text x="72" y="860" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">level 11 &middot; severity high &middot; confidence 0.90 &middot; MITRE T1027, Defense Evasion</text>
      <text x="812" y="818" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">active_response = null</text>
      <text x="812" y="836" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">level 11 meets no ActiveResponseEngine threshold, so the alert</text>
      <text x="812" y="854" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">carries no recommendation. Auto-remediation still records simulated</text>
      <text x="812" y="872" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">KILL_PROCESS_TREE and QUARANTINE_FILE entries that never execute.</text>

      <!-- ================= LEGEND ================= -->
      <line x1="48" y1="912" x2="1488" y2="912" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="128" y="922" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="156" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SCENARIO STEP</text>

      <rect x="284" y="922" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="312" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">THE DETECTION MOMENT</text>

      <line x1="484" y1="928" x2="520" y2="928" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="536" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HANDOFF BETWEEN LANES</text>

      <line x1="716" y1="928" x2="752" y2="928" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="768" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">THE EVENT CONTRACT CROSSING</text>

      <text x="48" y="964" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THIS IS A SCENARIO, NOT AN ARCHITECTURE. IT FOLLOWS ONE EVENT THROUGH THE SYSTEM; SEE THE HIGH-LEVEL ARCHITECTURE AND COMPONENT DIAGRAMS FOR STRUCTURE.</text>
      <text x="48" y="980" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THE COMMAND IS BENIGN: THE BASE64 PAYLOAD DECODES TO WRITE-HOST PANOPTICON-V1-DEMO. IT FIRES THE RULE BECAUSE ENCODING RAISES COMMAND-LINE ENTROPY, NOT BECAUSE IT IS MALICIOUS.</text>
      <text x="48" y="996" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">MORE THAN ONE DET-PROC-011 ROW IS NORMAL: ANY OTHER HIGH-ENTROPY POWERSHELL LAUNCH DURING THE WINDOW IS A GENUINE MATCH, NOT A FALSE POSITIVE.</text>
      <text x="48" y="1012" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THIS PATH WAS VERIFIED ON WINDOWS 11 BUILD 26220, X64, ELEVATED, WITH SYSMON V15.21 &#8212; SEE PANOPTICON_V1.MD AND THE V3 LIVE-VALIDATION SECTIONS.</text>
    </svg>
  </div>
