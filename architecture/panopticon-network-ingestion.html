    <h1>Implemented Officer-to-Manager network ingestion</h1>
    <svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-title network-desc">
      <title id="network-title">Implemented Panopticon Network Ingestion</title>
      <desc id="network-desc">Officer on an elevated Windows endpoint collects and normalizes telemetry, writes NDJSON to standard output, and optionally sends in-memory batches over HTTPS to Manager. Manager validates and durably stores events in SQLite, then its single detection worker claims events and invokes its vendored eyedetect engine. There is no Linux agent, endpoint command receiver, response handler, durable agent spool, enrollment, or authentication implementation.</desc>

      <rect width="1200" height="690" fill="#f5f5f5"/>

      <rect x="454" y="100" width="340" height="400" rx="8" fill="#fff" stroke="#2d3142"/><text x="624" y="126" text-anchor="middle" font-family="Geist Mono,monospace" font-size="8" fill="#4f5d75" letter-spacing="1.2">MANAGER PROCESS &middot; NO ENDPOINT CONTROL PRIVILEGE</text>
      <rect x="880" y="100" width="282" height="400" rx="8" fill="#fff" stroke="#2d3142"/><text x="1021" y="126" text-anchor="middle" font-family="Geist Mono,monospace" font-size="8" fill="#4f5d75" letter-spacing="1.2">DETECTION / PRESENTATION</text>
      <g font-family="Geist, sans-serif" text-anchor="middle"><rect x="74" y="164" width="218" height="62" rx="6" fill="#fff" stroke="#2d3142"/><text x="183" y="189" font-size="12" font-weight="600">Officer collectors + normalizer</text><text x="183" y="208" font-size="9" fill="#4f5d75">Sysmon / ETW &middot; Schema 0.3</text>
      <rect x="74" y="276" width="218" height="62" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text x="183" y="301" font-size="12" font-weight="600">Uploader background thread</text><text x="183" y="320" font-size="9" fill="#4f5d75">optional in-memory batches</text>
      <rect x="490" y="164" width="268" height="62" rx="6" fill="#fff" stroke="#2d3142"/><text x="624" y="189" font-size="12" font-weight="600">POST /api/v1/ingest</text><text x="624" y="208" font-size="9" fill="#4f5d75">bounded NDJSON &middot; event-id dedup</text>
      <rect x="490" y="276" width="268" height="62" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text x="624" y="301" font-size="12" font-weight="600">SQLite events table</text><text x="624" y="320" font-size="9" fill="#4f5d75">durable store + pending work queue</text>
      <rect x="490" y="388" width="268" height="62" rx="6" fill="#fff" stroke="#2d3142"/><text x="624" y="413" font-size="12" font-weight="600">DetectionWorker</text><text x="624" y="432" font-size="9" fill="#4f5d75">single claim / lease / detect thread</text>
      <rect x="916" y="164" width="210" height="62" rx="6" fill="#fff" stroke="#2d3142"/><text x="1021" y="189" font-size="12" font-weight="600">vendored eyedetect</text><text x="1021" y="208" font-size="9" fill="#4f5d75">rules + alert construction</text>

      <rect x="916" y="388" width="210" height="62" rx="6" fill="#fff" stroke="#2d3142"/><text x="1021" y="413" font-size="12" font-weight="600">Panopticon Console</text><text x="1021" y="432" font-size="9" fill="#4f5d75">read-only alert display</text></g>

      <line x1="38" y1="642" x2="1162" y2="642" stroke="rgba(45,49,66,.15)"/><text x="38" y="665" font-family="Geist Mono,monospace" font-size="8" fill="#4f5d75">SOLID = IMPLEMENTED SOURCE-BACKED COMPONENT &middot; DASHED = DESIGNED OR ABSENT &middot; OFFICER STDOUT REMAINS UNCONDITIONAL</text>
