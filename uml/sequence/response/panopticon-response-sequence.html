<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon &mdash; Closed-Loop Response Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1360px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 980px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML Sequence &#183; Response &mdash; closed-loop authorization &amp; execution</p>
    <h1>From detection recommendation to verified endpoint response</h1>

    <svg viewBox="0 0 1320 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="respseq-title respseq-desc">
      <title id="respseq-title">Closed-loop Response Sequence</title>
      <desc id="respseq-desc">ActiveResponseEngine resolves an action recommendation on the triggering event; AlertSink stages it in Manager SQLite WAL; the SOC Analyst authorizes it in Console; Manager translates it into a typed Command and dispatches it to the Endpoint Agent, which verifies PID ticks and executes via privilege-separated helpers.</desc>
      <defs>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES ================= -->
      <!-- L1: DetectionRun -->
      <line x1="120" y1="152" x2="120" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- L2: Manager Response Handler -->
      <line x1="360" y1="152" x2="360" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- L3: SQLite WAL Storage -->
      <line x1="600" y1="152" x2="600" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- L4: SOC Analyst / Console -->
      <line x1="840" y1="152" x2="840" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- L5: Endpoint Agent -->
      <line x1="1060" y1="152" x2="1060" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>
      <!-- L6: Privileged Executor -->
      <line x1="1240" y1="152" x2="1240" y2="860" stroke="rgba(45,49,66,0.25)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================= ACTIVATION BARS ================= -->
      <rect x="116" y="190" width="8" height="96" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="240" width="8" height="150" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="320" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="440" width="8" height="110" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="500" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="596" y="530" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1056" y="620" width="8" height="180" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="356" y="630" width="8" height="50" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1236" y="700" width="8" height="60" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================= PHASE 1: RECOMMENDATION & STAGING ================= -->
      <!-- M1: self resolve recommendation -->
      <path d="M 124,196 H 168 Q 176,196 176,204 V 220 Q 176,228 168,228 H 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="184" y="202" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="268" y="211" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">resolve_action(rule, event)</text>

      <!-- M2: Alert emitted with recommendation -->
      <line x1="124" y1="248" x2="356" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="176" y="232" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">emit(alert + active_response)</text>

      <!-- M3: translate recommendation & classify tier -->
      <path d="M 364,264 H 408 Q 416,264 416,272 V 288 Q 416,296 408,296 H 368" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="424" y="270" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="279" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">classify_tier &amp; verify PID ticks</text>

      <!-- M4: insert response_actions row -->
      <line x1="364" y1="330" x2="596" y2="330" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="412" y="314" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="488" y="323" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT response_actions (PENDING)</text>

      <!-- ================= PHASE DIVIDER 1 ================= -->
      <line x1="40" y1="410" x2="1280" y2="410" stroke="rgba(45,49,66,0.16)" stroke-width="0.8" stroke-dasharray="2,4"/>
      <rect x="140" y="398" width="220" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="407" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HUMAN-IN-THE-LOOP AUTHORIZATION</text>

      <!-- ================= PHASE 2: ANALYST REVIEW & AUTHORIZATION ================= -->
      <!-- M5: Analyst polls alerts & pending actions -->
      <line x1="836" y1="450" x2="604" y2="450" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="668" y="434" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="730" y="443" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/response-actions</text>

      <!-- M6: Pending rows returned -->
      <line x1="604" y1="480" x2="836" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <rect x="664" y="468" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="730" y="477" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PENDING ACTION &amp; TARGET</text>

      <!-- M7: Analyst clicks Authorize via Console server proxy -->
      <line x1="836" y1="512" x2="364" y2="512" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="520" y="498" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="604" y="507" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /response-actions/authorize</text>

      <!-- M8: Update state & create command -->
      <line x1="364" y1="544" x2="596" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="420" y="530" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="490" y="539" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT commands (AUTHORIZED)</text>

      <!-- ================= PHASE DIVIDER 2 ================= -->
      <line x1="40" y1="596" x2="1280" y2="596" stroke="rgba(45,49,66,0.16)" stroke-width="0.8" stroke-dasharray="2,4"/>
      <rect x="140" y="584" width="220" height="12" rx="2" fill="#f5f5f5"/>
      <text x="250" y="593" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DISPATCH, EXECUTION &amp; EVIDENCE</text>

      <!-- ================= PHASE 3: DISPATCH, EXECUTION & EVIDENCE ================= -->
      <!-- M9: Agent polls commands -->
      <line x1="1056" y1="636" x2="364" y2="636" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="664" y="622" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="716" y="631" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/v1/commands</text>

      <!-- M10: Command returned (DISPATCHED) -->
      <line x1="364" y1="664" x2="1056" y2="664" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <rect x="640" y="650" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="716" y="659" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMAND (ACTION, TARGET)</text>

      <!-- M11: Verify Target start time / boot ID -->
      <path d="M 1064,680 H 1104 Q 1112,680 1112,688 V 696 Q 1112,704 1104,704 H 1068" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="1116" y="686" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1188" y="695" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">verify PID start_time_ticks</text>

      <!-- M12: Safe Execution via Privileged helper -->
      <line x1="1064" y1="720" x2="1236" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="1096" y="708" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1150" y="717" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UDS IPC: opcode isolate</text>

      <!-- M13: Execution Result returned -->
      <line x1="1236" y1="748" x2="1064" y2="748" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <rect x="1108" y="736" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1150" y="745" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS 0</text>

      <!-- M14: Submit Cryptographic Evidence -->
      <line x1="1056" y1="784" x2="364" y2="784" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="652" y="770" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="718" y="779" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /commands/{id}/result</text>

      <!-- M15: Commit Terminal Status -->
      <line x1="364" y1="808" x2="596" y2="808" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <rect x="424" y="796" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="805" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPDATE status = SUCCEEDED</text>

      <!-- ================= PARTICIPANTS ================= -->
      <!-- P1: DetectionRun -->
      <rect x="40" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="120" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DetectionRun</text>
      <text x="120" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ActiveResponseEngine</text>

      <!-- P2: Manager Response Handler -->
      <rect x="280" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Manager API</text>
      <text x="360" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">policy &amp; command router</text>

      <!-- P3: SQLite WAL Storage -->
      <rect x="520" y="88" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="600" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">panopticon.db</text>
      <text x="600" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">actions &amp; commands (WAL)</text>

      <!-- P4: SOC Analyst / Console -->
      <rect x="760" y="88" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="840" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SOC Analyst</text>
      <text x="840" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Console UI @ :8787</text>

      <!-- P5: Endpoint Agent -->
      <rect x="980" y="88" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1060" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Endpoint Agent</text>
      <text x="1060" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">command worker thread</text>

      <!-- P6: Privileged Executor -->
      <rect x="1160" y="88" width="150" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1235" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Safe Executor</text>
      <text x="1235" y="132" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CAP_NET_ADMIN / WFP</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="890" x2="1280" y2="890" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="910" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="40" y1="934" x2="64" y2="934" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="74" y="937" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SYNC CALL / WRITE</text>

      <line x1="220" y1="934" x2="244" y2="934" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <text x="254" y="937" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN VALUE</text>

      <line x1="400" y1="934" x2="424" y2="934" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="434" y="937" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTPS CALL</text>

      <line x1="570" y1="934" x2="594" y2="934" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="604" y="937" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESPONSE ACTION DISPATCH</text>

      <rect x="800" y="926" width="8" height="16" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="822" y="937" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ACTIVATION BAR</text>
    </svg>
  </div>
</body>
</html>
