<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="detseq-title detseq-desc">
      <title id="detseq-title">Detection Sequence</title>
      <desc id="detseq-desc">UML sequence diagram in which the streaming pipeline hands one event to DetectionRun, which asks the RuleEvaluator to route by event type and evaluate the rule logic tree, builds an Alert with a response recommendation, persists it to the SQLite spool, and either writes it to the alerts file and marks it delivered, or marks it failed for bounded retry.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow-filled" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-async" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES ================= -->
      <line x1="140" y1="152" x2="140" y2="780" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="380" y1="152" x2="380" y2="780" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="620" y1="152" x2="620" y2="780" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="880" y1="152" x2="880" y2="780" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="1120" y1="152" x2="1120" y2="780" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ================= ALT FRAGMENT ================= -->
      <rect x="100" y="536" width="1060" height="208" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="100" y="536" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="120" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="152" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[append to alerts.ndjson succeeds]</text>
      <line x1="108" y1="672" x2="1152" y2="672" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="112" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else, the write raised]</text>

      <!-- ================= ACTIVATION BARS ================= -->
      <rect x="136" y="200" width="8" height="536" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="376" y="200" width="8" height="232" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="616" y="240" width="8" height="96" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="472" width="8" height="36" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="648" width="8" height="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="876" y="720" width="8" height="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="1116" y="584" width="8" height="32" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================= MESSAGES ================= -->
      <line x1="144" y1="200" x2="372" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="384" y1="240" x2="612" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <path d="M 624,272 H 664 Q 672,272 672,280 V 296 Q 672,304 664,304 H 628"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="612" y1="336" x2="388" y2="336" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <path d="M 384,368 H 424 Q 432,368 432,376 V 392 Q 432,400 424,400 H 388"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="372" y1="432" x2="148" y2="432" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <line x1="144" y1="472" x2="872" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="872" y1="508" x2="148" y2="508" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>

      <line x1="144" y1="584" x2="1112" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="1112" y1="616" x2="148" y2="616" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="144" y1="648" x2="872" y2="648" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <line x1="144" y1="720" x2="872" y2="720" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>

      <!-- ================= MESSAGE LABELS ================= -->
      <rect x="168" y="176" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">process_event(event dict)</text>

      <rect x="412" y="216" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">evaluate_event(event)</text>

      <rect x="680" y="276" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="285" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">route by event_type to candidate rules</text>
      <rect x="680" y="292" width="248" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">walk LogicNode via ConditionMatcher</text>

      <rect x="400" y="312" width="192" height="12" rx="2" fill="#f5f5f5"/>
      <text x="496" y="321" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">List[DetectionResult]</text>

      <rect x="440" y="372" width="252" height="12" rx="2" fill="#f5f5f5"/>
      <text x="444" y="381" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">Alert.from_detection_result(result)</text>
      <rect x="440" y="388" width="252" height="12" rx="2" fill="#f5f5f5"/>
      <text x="444" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">then stages B-G, correlation, risk</text>

      <rect x="180" y="408" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="417" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">List[Alert]</text>

      <rect x="420" y="448" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="457" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">persist(alert) BEFORE WRITE</text>

      <rect x="420" y="484" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">new | duplicate</text>

      <rect x="500" y="560" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="569" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">write(record), flush, fsync</text>

      <rect x="500" y="592" width="216" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="601" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPENDED, CONSOLE CAN SEE IT</text>

      <rect x="420" y="624" width="176" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="633" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mark_delivered(alert_id)</text>

      <rect x="392" y="696" width="232" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="705" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">mark_failed: RETRY OR DEAD</text>

      <!-- ================= PARTICIPANTS ================= -->
      <rect x="40" y="88" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="140" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StreamingPipeline</text>
      <text x="140" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consumer thread</text>

      <rect x="280" y="88" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="88" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DetectionRun</text>
      <text x="380" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stages A to G</text>

      <rect x="520" y="88" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="88" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="620" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RuleEvaluator</text>
      <text x="620" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">86 rules indexed</text>

      <rect x="780" y="88" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="780" y="88" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="880" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AlertSpool</text>
      <text x="880" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite WAL</text>

      <rect x="1020" y="88" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="1020" y="88" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="1120" y="114" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AlertWriter</text>
      <text x="1120" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">alerts.ndjson</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="812" x2="1240" y2="812" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="828" x2="156" y2="828" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-filled)"/>
      <text x="176" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SYNCHRONOUS CALL</text>

      <line x1="336" y1="828" x2="372" y2="828" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-filled)"/>
      <text x="392" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="500" y1="828" x2="536" y2="828" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="556" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HEADLINE SUCCESS</text>

      <rect x="716" y="822" width="8" height="12" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="736" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACTIVATION</text>

      <rect x="864" y="822" width="20" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="892" y="832" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMBINED FRAGMENT (ALT)</text>

      <text x="40" y="864" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ONLY STREAMINGPIPELINE, ALERTSPOOL AND ALERTWRITER PARTICIPATE IN THE ALT; DETECTIONRUN AND RULEEVALUATOR LIFELINES MERELY PASS THROUGH THE FRAME.</text>
      <text x="40" y="880" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">PERSIST HAPPENS BEFORE THE FILE WRITE, SO A CRASH BETWEEN THEM LEAVES THE ALERT PENDING AND RECOVER() RE-DELIVERS IT. DEDUPLICATION IS BY DETERMINISTIC ALERT_ID.</text>
    </svg>
