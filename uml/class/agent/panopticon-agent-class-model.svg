<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentclass-title agentclass-desc">
      <title id="agentclass-title">Officer Agent Class Model</title>
      <desc id="agentclass-desc">UML class diagram of the Officer agent showing the TelemetryCollector interface realized by the ETW and Sysmon collectors, which publish a RawProcessEvent that is composed into an EnrichedProcessEvent and normalized into a PanopticonEvent owning its ProcessMetadata.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M 0,0 L 9,4 L 0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
        <marker id="triangle" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
          <polygon points="0 0, 13 6, 0 12" fill="#f5f5f5" stroke="#eb6c36" stroke-width="1"/>
        </marker>
        <marker id="triangle-ink" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
          <polygon points="0 0, 13 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="diamond-filled" markerWidth="18" markerHeight="10" refX="1" refY="5" orient="auto">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="diamond-hollow" markerWidth="18" markerHeight="10" refX="1" refY="5" orient="auto">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= RELATIONSHIPS (drawn before boxes) ================= -->
      <path d="M 200,296 V 264 Q 200,256 208,256 H 312 Q 320,256 320,248 V 216"
            fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#triangle)"/>
      <path d="M 592,296 V 264 Q 592,256 584,256 H 488 Q 480,256 480,248 V 216"
            fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#triangle)"/>
      <line x1="552" y1="152" x2="856" y2="152" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <line x1="1008" y1="296" x2="1008" y2="224" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <line x1="1008" y1="432" x2="1008" y2="504" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <line x1="1008" y1="640" x2="1008" y2="712" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>

      <!-- ================= RELATIONSHIP LABELS + MULTIPLICITY ================= -->
      <rect x="640" y="124" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="704" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISHES RAWEVENT</text>

      <rect x="1018" y="234" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1026" y="243" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="1018" y="274" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1026" y="283" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <rect x="1018" y="456" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1058" y="465" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NORMALIZE</text>

      <rect x="1018" y="650" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1026" y="659" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="1018" y="690" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1026" y="699" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <!-- ================= CLASS: TelemetryCollector (focal interface) ================= -->
      <rect x="248" y="88" width="304" height="128" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="88" width="304" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="400" y="108" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">&#171;interface&#187;</text>
      <text x="400" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TelemetryCollector</text>
      <line x1="248" y1="140" x2="552" y2="140" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="264" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ name(): string_view</text>
      <text x="264" y="176" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ start(RawEventSink, ErrorSink, str&amp;): bool</text>
      <text x="264" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ stop(): void</text>
      <text x="264" y="208" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ running(): bool</text>

      <!-- ================= CLASS: EtwProcessCollector ================= -->
      <rect x="48" y="296" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="296" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EtwProcessCollector</text>
      <line x1="48" y1="332" x2="352" y2="332" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="352" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- impl_: unique_ptr&lt;Impl&gt;</text>
      <line x1="48" y1="364" x2="352" y2="364" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="384" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ start(...): bool</text>
      <text x="64" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ stop(): void</text>
      <text x="64" y="416" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">StartTraceW / OpenTraceW / TDH</text>

      <!-- ================= CLASS: SysmonEventCollector ================= -->
      <rect x="440" y="296" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="296" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="592" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SysmonEventCollector</text>
      <line x1="440" y1="332" x2="744" y2="332" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="456" y="352" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- impl_: unique_ptr&lt;Impl&gt;</text>
      <line x1="440" y1="364" x2="744" y2="364" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="456" y="384" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ start(...): bool</text>
      <text x="456" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ stop(): void</text>
      <text x="456" y="416" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">EvtSubscribe, EID 1/3/7/11-14/23/26</text>

      <!-- ================= STRUCT: RawProcessEvent ================= -->
      <rect x="856" y="88" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="88" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1008" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RawProcessEvent</text>
      <line x1="856" y1="124" x2="1160" y2="124" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="872" y="144" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ source: SourceProvenance</text>
      <text x="872" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ process_start_time: UtcTimestamp</text>
      <text x="872" y="176" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ pid: uint32_t</text>
      <text x="872" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ parent_pid: optional&lt;uint32_t&gt;</text>
      <text x="872" y="208" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">&#8230; executable, command_line, sha256</text>

      <!-- ================= STRUCT: EnrichedProcessEvent ================= -->
      <rect x="856" y="296" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="296" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1008" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EnrichedProcessEvent</text>
      <line x1="856" y1="332" x2="1160" y2="332" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="872" y="352" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ raw: RawProcessEvent</text>
      <text x="872" y="368" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ user: ResolvedUser</text>
      <text x="872" y="384" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ process_name: optional&lt;string&gt;</text>
      <text x="872" y="400" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ sha256: optional&lt;string&gt;</text>
      <text x="872" y="416" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ parent_start_time: optional&lt;Utc&gt;</text>

      <!-- ================= STRUCT: PanopticonEvent ================= -->
      <rect x="856" y="504" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="504" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1008" y="528" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PanopticonEvent</text>
      <line x1="856" y1="540" x2="1160" y2="540" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="872" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ schema_version: string = &quot;0.3&quot;</text>
      <text x="872" y="576" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ event: EventMetadata</text>
      <text x="872" y="592" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ source: SourceMetadata</text>
      <text x="872" y="608" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ process: ProcessMetadata</text>
      <text x="872" y="624" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">&#8230; optional network/file/registry/image</text>

      <!-- ================= STRUCT: ProcessMetadata ================= -->
      <rect x="856" y="712" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="712" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1008" y="736" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ProcessMetadata</text>
      <line x1="856" y1="748" x2="1160" y2="748" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="872" y="768" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ entity_id: string  proc_&lt;64 hex&gt;</text>
      <text x="872" y="784" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ pid: uint32_t</text>
      <text x="872" y="800" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ command_line: optional&lt;string&gt;</text>
      <text x="872" y="816" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ parent: ParentProcessMetadata</text>
      <text x="872" y="832" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ hash: ProcessHashMetadata</text>

      <!-- ================= LEGEND ================= -->
      <line x1="48" y1="888" x2="1232" y2="888" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="128" y1="904" x2="160" y2="904" stroke="#2d3142" stroke-width="1" marker-end="url(#triangle-ink)"/>
      <text x="192" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INHERITANCE</text>

      <line x1="304" y1="904" x2="336" y2="904" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#triangle-ink)"/>
      <text x="368" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">REALIZATION</text>

      <line x1="480" y1="904" x2="524" y2="904" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <text x="536" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPOSITION</text>

      <line x1="656" y1="904" x2="700" y2="904" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-hollow)"/>
      <text x="712" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">AGGREGATION</text>

      <line x1="832" y1="904" x2="864" y2="904" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
      <text x="884" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASSOCIATION</text>

      <line x1="1000" y1="904" x2="1032" y2="904" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="1052" y="908" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DEPENDENCY</text>

      <text x="48" y="940" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">EVERY TYPE ABOVE EXISTS IN INCLUDE/PANOPTICON/OFFICER/. THE COLLECTORS USE THE PIMPL IDIOM, SO ETW SESSION HANDLES AND THE SYSMON SUBSCRIPTION LIVE INSIDE IMPL.</text>
      <text x="48" y="956" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">AGGREGATION APPEARS IN THE LEGEND FOR COMPLETENESS BUT DOES NOT OCCUR IN THIS MODEL: ALL OWNERSHIP IS BY VALUE OR UNIQUE_PTR, WHICH IS COMPOSITION.</text>
      <text x="48" y="972" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">RAWEVENT IS A STD::VARIANT OVER RAWPROCESSEVENT PLUS THE FOUR V3 FAMILY STRUCTS; ONLY THE PROCESS MEMBER IS DRAWN, SO THE ENRICHMENT PATH STAYS LEGIBLE.</text>
    </svg>
