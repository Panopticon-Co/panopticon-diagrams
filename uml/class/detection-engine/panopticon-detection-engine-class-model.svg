<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="declass-title declass-desc">
      <title id="declass-title">eyedetect Detection Engine Class Model</title>
      <desc id="declass-desc">UML class diagram of the detection engine showing DetectionRun aggregating the RuleEvaluator, which aggregates Rules whose recursive LogicNode and Condition tree it evaluates, producing DetectionResult objects that Alert is built from, with the response field carried as a recommendation only.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
          <path d="M 0,0 L 9,4 L 0,8" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </marker>
        <marker id="triangle-ink" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto">
          <polygon points="0 0, 13 6, 0 12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="diamond-filled" markerWidth="18" markerHeight="10" refX="1" refY="5" orient="auto">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
        </marker>
        <marker id="diamond-hollow" markerWidth="18" markerHeight="10" refX="1" refY="5" orient="auto">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= RELATIONSHIPS ================= -->
      <!-- aggregation: DetectionRun has a RuleEvaluator (injected, independent lifetime) -->
      <line x1="208" y1="256" x2="208" y2="336" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-hollow)"/>
      <!-- aggregation: RuleEvaluator holds the loaded Rules -->
      <path d="M 368,376 H 420 Q 428,376 428,368 V 164 Q 428,156 436,156 H 488"
            fill="none" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-hollow)"/>
      <!-- composition: Rule owns its LogicNode -->
      <line x1="640" y1="224" x2="640" y2="304" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <!-- composition: LogicNode owns its Conditions -->
      <line x1="640" y1="408" x2="640" y2="488" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <!-- reflexive composition: a LogicNode may nest LogicNodes -->
      <path d="M 488,328 H 456 Q 448,328 448,336 V 376 Q 448,384 456,384 H 488"
            fill="none" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <!-- dependency: RuleEvaluator creates DetectionResult (bridged over the Condition composition) -->
      <path d="M 368,448 H 632 a 8,8 0 0,1 16,0 H 840 Q 848,448 848,440 V 384 Q 848,376 856,376 H 880"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- dependency: Alert.from_detection_result reads a DetectionResult -->
      <line x1="1032" y1="520" x2="1032" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <!-- dependency: DetectionRun emits Alerts -->
      <path d="M 48,200 H 32 Q 24,200 24,208 V 752 Q 24,760 32,760 H 1024 Q 1032,760 1032,752 V 720"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>

      <!-- ================= LABELS AND MULTIPLICITY ================= -->
      <rect x="218" y="266" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="226" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="218" y="314" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="226" y="323" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>

      <rect x="438" y="140" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="454" y="149" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

      <rect x="650" y="234" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="658" y="243" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="650" y="418" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="666" y="427" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0..*</text>

      <rect x="380" y="344" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="410" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NESTED</text>

      <rect x="472" y="424" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATES</text>

      <rect x="1042" y="470" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1086" y="479" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILDS FROM</text>

      <rect x="440" y="738" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="747" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMITS</text>

      <!-- ================= CLASS: DetectionRun ================= -->
      <rect x="48" y="88" width="320" height="168" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="88" width="320" height="168" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DetectionRun</text>
      <line x1="48" y1="124" x2="368" y2="124" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="144" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ evaluator: RuleEvaluator</text>
      <text x="64" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ threshold_engine: ThresholdEngine</text>
      <text x="64" y="176" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ correlation_engine: CorrelationEngine</text>
      <text x="64" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ auto_remediate: bool</text>
      <text x="64" y="208" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">&#8230; 8 further detector engines, counters</text>
      <line x1="48" y1="220" x2="368" y2="220" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="240" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ process_event(event: dict): List[Alert]</text>

      <!-- ================= CLASS: RuleEvaluator (focal) ================= -->
      <rect x="48" y="336" width="320" height="200" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="336" width="320" height="200" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="208" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RuleEvaluator</text>
      <line x1="48" y1="372" x2="368" y2="372" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="64" y="392" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _rules_by_type: Dict[str, List[Rule]]</text>
      <text x="64" y="408" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _matched_rules_history: Dict[str, Set]</text>
      <text x="64" y="424" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ process_tree: ProcessTree</text>
      <text x="64" y="440" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ threat_intel: ThreatIntelEngine</text>
      <line x1="48" y1="452" x2="368" y2="452" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="64" y="472" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ evaluate_event(event): List[DetectionResult]</text>
      <text x="64" y="488" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ set_rules(rules: List[Rule]): None</text>
      <text x="64" y="504" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _evaluate_logic_node(node, event): bool</text>
      <text x="64" y="520" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">- _extract_evidence(rule, event): Dict</text>

      <!-- ================= CLASS: Rule ================= -->
      <rect x="488" y="88" width="304" height="136" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="88" width="304" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rule</text>
      <line x1="488" y1="124" x2="792" y2="124" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="504" y="144" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ id: str          DET-XXX-NNN</text>
      <text x="504" y="160" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ event_type: str  routing key</text>
      <text x="504" y="176" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ logic: LogicNode</text>
      <text x="504" y="192" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ level: int       0..16</text>
      <text x="504" y="208" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">&#8230; severity, confidence, mitre, evidence</text>

      <!-- ================= CLASS: LogicNode ================= -->
      <rect x="488" y="304" width="304" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="304" width="304" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LogicNode</text>
      <line x1="488" y1="340" x2="792" y2="340" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="504" y="360" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ all: Optional[List[Condition|LogicNode]]</text>
      <text x="504" y="376" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ any: Optional[List[Condition|LogicNode]]</text>
      <text x="504" y="392" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ none: Optional[List[Condition|LogicNode]]</text>

      <!-- ================= CLASS: Condition ================= -->
      <rect x="488" y="488" width="304" height="120" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="488" width="304" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="640" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Condition</text>
      <line x1="488" y1="524" x2="792" y2="524" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="504" y="544" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ field: str        dotted path</text>
      <text x="504" y="560" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ operator: str     13 + 3 special</text>
      <text x="504" y="576" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ value: Any</text>
      <text x="504" y="592" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ case_sensitive: bool = False</text>

      <!-- ================= CLASS: DetectionResult ================= -->
      <rect x="880" y="336" width="304" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="336" width="304" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1032" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DetectionResult</text>
      <line x1="880" y1="372" x2="1184" y2="372" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="896" y="392" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ rule: Rule</text>
      <text x="896" y="408" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ event: Dict[str, Any]</text>
      <text x="896" y="424" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ matched_evidence: Dict[str, Any]</text>

      <!-- ================= CLASS: Alert ================= -->
      <rect x="880" y="520" width="304" height="200" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="520" width="304" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1032" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Alert</text>
      <line x1="880" y1="556" x2="1184" y2="556" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="896" y="576" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ alert_id: str    ALT-XXXXXXXX</text>
      <text x="896" y="592" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ rule_id: str</text>
      <text x="896" y="608" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ level: int       0..16</text>
      <text x="896" y="624" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ evidence: Dict[str, Any]</text>
      <text x="896" y="640" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">+ active_response: Optional[Dict]</text>
      <line x1="880" y1="652" x2="1184" y2="652" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="896" y="672" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ from_detection_result(r): Alert</text>
      <text x="896" y="688" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">+ to_dict(): Dict[str, Any]</text>

      <!-- ================= LEGEND ================= -->
      <line x1="24" y1="800" x2="1256" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="24" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="104" y1="816" x2="136" y2="816" stroke="#2d3142" stroke-width="1" marker-end="url(#triangle-ink)"/>
      <text x="168" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INHERITANCE</text>

      <line x1="280" y1="816" x2="312" y2="816" stroke="#2d3142" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#triangle-ink)"/>
      <text x="344" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">REALIZATION</text>

      <line x1="456" y1="816" x2="500" y2="816" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-filled)"/>
      <text x="512" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">COMPOSITION</text>

      <line x1="632" y1="816" x2="676" y2="816" stroke="#2d3142" stroke-width="1" marker-start="url(#diamond-hollow)"/>
      <text x="688" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">AGGREGATION</text>

      <line x1="808" y1="816" x2="840" y2="816" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow-open)"/>
      <text x="860" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ASSOCIATION</text>

      <line x1="976" y1="816" x2="1008" y2="816" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-open)"/>
      <text x="1028" y="820" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DEPENDENCY</text>

      <text x="24" y="852" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">ACTIVE_RESPONSE IS A RECOMMENDATION ONLY. ACTIVERESPONSEENGINE.RESOLVE_ACTION FILLS IT; NOTHING IN THIS ENGINE EXECUTES IT ON AN ENDPOINT.</text>
      <text x="24" y="868" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">DETECTIONRUN ALSO DRIVES SIX FURTHER STAGES (CLOUD, IDENTITY, RANSOMWARE, BEACON, PORT SCAN, THRESHOLD) THAT BUILD ALERTS DIRECTLY; ONLY STAGE A IS EXPANDED HERE.</text>
      <text x="24" y="884" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">RULE, LOGICNODE AND CONDITION ARE PYDANTIC MODELS IN SRC/RULES/SCHEMA.PY. DETECTIONRESULT AND ALERT ARE DATACLASSES.</text>
      <text x="24" y="900" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">INHERITANCE AND REALIZATION APPEAR IN THE LEGEND FOR COMPLETENESS; THIS MODEL USES COMPOSITION, AGGREGATION AND DEPENDENCY ONLY.</text>
    </svg>
