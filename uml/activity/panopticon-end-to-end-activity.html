<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panopticon — End-to-End Activity</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">UML Activity &middot; One run, start to analyst</p>
    <h1>The workflow, with its real branch points</h1>

    <svg viewBox="0 0 1100 1120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="activity-title activity-desc">
      <title id="activity-title">Panopticon End-to-End Activity</title>
      <desc id="activity-desc">UML activity diagram beginning with concurrent ETW and Sysmon collection joined into one normalization and serialization flow, then ingestion, rule evaluation, a decision on whether any rule matched, alert construction and durable append, console rendering, and a final decision on whether a response recommendation is present, ending outside Panopticon.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= TRANSITIONS ================= -->
      <line x1="292" y1="104" x2="292" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="172" y1="150" x2="172" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="412" y1="150" x2="412" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="172" y1="248" x2="172" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="412" y1="248" x2="412" y2="276" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="292" y1="290" x2="292" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="292" y1="392" x2="292" y2="428" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 408,468 H 552 Q 560,468 560,460 V 220 Q 560,212 568,212 H 680"
            fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="800" y1="248" x2="800" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="856" y1="320" x2="980" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="356" x2="800" y2="412" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="488" x2="800" y2="524" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="600" x2="800" y2="636" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="712" x2="800" y2="744" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="820" x2="800" y2="860" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 856,784 H 984 Q 992,784 992,792 V 968 Q 992,976 984,976 H 820"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="800" y1="936" x2="800" y2="956" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ================= GUARDS AND EDGE LABELS ================= -->
      <rect x="572" y="180" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="620" y="189" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCHEMA 0.3</text>

      <rect x="864" y="296" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="920" y="305" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[no rule matched]</text>

      <rect x="812" y="368" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="377" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">[detection]</text>

      <rect x="812" y="828" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="816" y="837" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">[recommendation]</text>

      <rect x="880" y="760" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="920" y="769" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">[else]</text>

      <rect x="180" y="156" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="184" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ETW THREAD</text>
      <rect x="420" y="156" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="165" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SYSMON THREAD</text>

      <!-- ================= CONTROL NODES ================= -->
      <!-- initial -->
      <circle cx="292" cy="88" r="12" fill="#2d3142"/>
      <!-- fork bar -->
      <rect x="160" y="140" width="264" height="8" rx="2" fill="#2d3142"/>
      <rect x="440" y="138" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="147" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FORK</text>
      <!-- join bar -->
      <rect x="160" y="282" width="264" height="8" rx="2" fill="#2d3142"/>
      <rect x="440" y="280" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOIN</text>
      <!-- decision 1 -->
      <polygon points="800,284 856,320 800,356 744,320" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="316" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">any rule</text>
      <text x="800" y="330" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">matched?</text>
      <!-- flow final (event discarded) -->
      <circle cx="1000" cy="320" r="16" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="990" y1="310" x2="1010" y2="330" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="1010" y1="310" x2="990" y2="330" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="944" y="348" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1000" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT DISCARDED</text>
      <!-- decision 2 -->
      <polygon points="800,748 856,784 800,820 744,784" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="780" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">response</text>
      <text x="800" y="794" fill="#2d3142" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">field set?</text>
      <!-- activity final -->
      <circle cx="800" cy="976" r="16" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="800" cy="976" r="9" fill="#2d3142"/>

      <!-- ================= ACTIVITY NODES ================= -->
      <rect x="64" y="176" width="216" height="72" rx="16" fill="#f5f5f5"/>
      <rect x="64" y="176" width="216" height="72" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="172" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receive ETW record</text>
      <text x="172" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kernel-Process EID 1</text>
      <text x="172" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decode via TDH</text>

      <rect x="304" y="176" width="216" height="72" rx="16" fill="#f5f5f5"/>
      <rect x="304" y="176" width="216" height="72" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="412" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Receive Sysmon event</text>
      <text x="412" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EID 1/3/7/11-14/23/26</text>
      <text x="412" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decode rendered XML</text>

      <rect x="176" y="316" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="176" y="316" width="232" height="76" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Enrich and normalize</text>
      <text x="292" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">derive proc_ and evt_ ids</text>
      <text x="292" y="380" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CNG SHA-256</text>

      <rect x="176" y="428" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="176" y="428" width="232" height="76" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="292" y="458" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Serialize and emit</text>
      <text x="292" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one NDJSON line, stdout</text>
      <text x="292" y="492" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flushed immediately</text>

      <rect x="684" y="176" width="232" height="72" rx="16" fill="#f5f5f5"/>
      <rect x="684" y="176" width="232" height="72" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingest and evaluate</text>
      <text x="800" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">queue, then stages A to G</text>
      <text x="800" y="238" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">86 rules</text>

      <rect x="684" y="412" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="684" y="412" width="232" height="76" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="442" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build the alert</text>
      <text x="800" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic ALT- id</text>
      <text x="800" y="476" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">attach recommendation</text>

      <rect x="684" y="524" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="684" y="524" width="232" height="76" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Persist, then append</text>
      <text x="800" y="572" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spool, then alerts.ndjson</text>
      <text x="800" y="588" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retry until delivered or dead</text>

      <rect x="684" y="636" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="684" y="636" width="232" height="76" rx="16" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="800" y="666" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Render for the analyst</text>
      <text x="800" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">console polls every 3 s</text>
      <text x="800" y="700" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">row + evidence pairs</text>

      <rect x="684" y="860" width="232" height="76" rx="16" fill="#f5f5f5"/>
      <rect x="684" y="860" width="232" height="76" rx="16" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
      <text x="800" y="890" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Analyst acts manually</text>
      <text x="800" y="908" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outside Panopticon</text>
      <text x="800" y="924" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no in-tool action exists</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="1024" x2="1060" y2="1024" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="128" cy="1040" r="7" fill="#2d3142"/>
      <text x="144" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">INITIAL</text>

      <circle cx="228" cy="1040" r="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="228" cy="1040" r="4" fill="#2d3142"/>
      <text x="244" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACTIVITY FINAL</text>

      <circle cx="380" cy="1040" r="8" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="375" y1="1035" x2="385" y2="1045" stroke="#2d3142" stroke-width="1.2"/>
      <line x1="385" y1="1035" x2="375" y2="1045" stroke="#2d3142" stroke-width="1.2"/>
      <text x="396" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FLOW FINAL</text>

      <polygon points="536,1032 552,1040 536,1048 520,1040" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="560" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DECISION</text>

      <rect x="672" y="1036" width="40" height="6" rx="2" fill="#2d3142"/>
      <text x="720" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">FORK / JOIN</text>

      <rect x="828" y="1032" width="24" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="860" y="1044" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ACTIVITY</text>

      <text x="40" y="1076" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THE FORK IS REAL: BOTH COLLECTORS RUN CONCURRENTLY ON SEPARATE THREADS AND PUBLISH INTO THE SAME RAWEVENTSINK. THE JOIN IS THAT SHARED SINK.</text>
      <text x="40" y="1092" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THERE IS NO INCIDENT-CLOSURE ACTIVITY BECAUSE PANOPTICON HAS NO CASE LIFECYCLE. THE RUN ENDS WHEN THE ANALYST HAS SEEN THE ROW.</text>
      <text x="40" y="1108" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">THE PERSIST-THEN-APPEND ACTIVITY HIDES ITS OWN RETRY LOOP; THAT LOOP IS DRAWN IN FULL IN THE ALERT LIFECYCLE STATE MACHINE.</text>
    </svg>
  </div>
</body>
</html>
